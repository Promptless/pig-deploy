apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pig-trace-analyzer.fullname" . }}
  labels:
    {{- include "pig-trace-analyzer.labels" . | nindent 4 }}
    {{- include "pig-trace-analyzer.datadogLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: analyzer
      app.kubernetes.io/name: {{ include "pig-trace-analyzer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: analyzer
        app.kubernetes.io/name: {{ include "pig-trace-analyzer.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "pig-trace-analyzer.datadogLabels" . | nindent 8 }}
      {{- if or .Values.observability.datadog.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.observability.datadog.enabled }}
        ad.datadoghq.com/worker.logs: {{ printf "[{\"source\":\"python\",\"service\":%q}]" .Values.observability.datadog.service | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pig-trace-analyzer.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "pig-trace-analyzer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.workerPort }}
          env:
            - name: PIG_RUNTIME_BASE_URL
              value: {{ required "pig.runtimeBaseUrl is required" .Values.pig.runtimeBaseUrl | quote }}
            - name: PIG_PORT
              value: {{ .Values.service.workerPort | int | quote }}
            - name: PIG_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: PIG_CONFIG_HASH
              value: {{ required "pig.configHash is required" .Values.pig.configHash | quote }}
            {{- include "pig-trace-analyzer.storageEnv" . | nindent 12 }}
            - name: PIG_MAX_TRACE_BATCH_BYTES
              value: {{ .Values.pig.maxTraceBatchBytes | int | quote }}
            - name: PIG_LOG_LEVEL
              value: {{ .Values.pig.logLevel | default "INFO" | quote }}
            {{- include "pig-trace-analyzer.observabilityEnv" . | nindent 12 }}
            - name: PIG_ANALYSIS_QUIET_WINDOW_HOURS
              value: {{ .Values.pig.analysis.quietWindowHours | quote }}
            {{- if or .Values.pig.analysis.activationAt .Values.pig.analysis.catalogEnabled }}
            {{- if .Values.pig.analysis.activationAt }}
            - name: PIG_ANALYSIS_ACTIVATION_AT
              value: {{ .Values.pig.analysis.activationAt | quote }}
            {{- end }}
            - name: PIG_ANALYSIS_MODEL_PROVIDER
              value: {{ required "pig.analysis.modelApi.provider is required when trace analysis or catalog indexing is enabled" .Values.pig.analysis.modelApi.provider | quote }}
            - name: PIG_ANALYSIS_MODEL_AUTHENTICATION
              value: {{ required "pig.analysis.modelApi.authentication is required when trace analysis or catalog indexing is enabled" .Values.pig.analysis.modelApi.authentication | quote }}
            - name: PIG_ANALYSIS_MODEL_BASE_URL
              value: {{ required "pig.analysis.modelApi.baseUrl is required when trace analysis or catalog indexing is enabled" .Values.pig.analysis.modelApi.baseUrl | quote }}
            {{- if eq .Values.pig.analysis.modelApi.authentication "api_key" }}
            - name: PIG_ANALYSIS_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pig-trace-analyzer.secretName" . }}
                  key: {{ .Values.secrets.analysisModelApiKeyKey }}
            {{- end }}
            - name: PIG_ANALYSIS_MODEL_NAME
              value: {{ required "pig.analysis.modelApi.model is required when trace analysis or catalog indexing is enabled" .Values.pig.analysis.modelApi.model | quote }}
            - name: PIG_ANALYSIS_MIRROR_ROOT
              value: {{ .Values.pig.analysis.mirrorRoot | quote }}
            {{- end }}
            - name: PIG_INSTALL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pig-trace-analyzer.secretName" . }}
                  key: {{ .Values.secrets.installTokenKey }}
            - name: PIG_CUSTOMER_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pig-trace-analyzer.secretName" . }}
                  key: {{ .Values.secrets.customerPostgresDsnKey }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "pig-trace-analyzer.caMount" . | nindent 12 }}
          {{- if or .Values.pig.analysis.activationAt .Values.pig.analysis.catalogEnabled }}
            - name: analysis-mirrors
              mountPath: /var/lib/pig
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "pig-trace-analyzer.caVolume" . | nindent 8 }}
      {{- if or .Values.pig.analysis.activationAt .Values.pig.analysis.catalogEnabled }}
        - name: analysis-mirrors
          emptyDir: {}
      {{- end }}
