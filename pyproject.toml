[project]
name = "pig-supervisor"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3", "packaging>=24", "PyYAML>=6,<7"]
[project.scripts]
pig-supervisor = "pig_supervisor.main:main"
pig-release = "pig_supervisor.publication:main"
pig-release-inspect = "pig_supervisor.inspect_release:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["supervisor/pig_supervisor"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "jsonschema>=4", "python-hcl2>=7"]
[tool.ruff]
line-length = 120
[tool.pytest.ini_options]
pythonpath = ["supervisor"]
