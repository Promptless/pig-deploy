{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.hosts }}
{{- fail "gateway.hosts is required when gateway.enabled=true" }}
{{- end }}
{{- if not .Values.gateway.tls }}
{{- fail "gateway.tls is required when gateway.enabled=true; configure HTTPS with a TLS Secret or controller-managed certificate" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pig-trace-analyzer.fullname" . }}
  labels:
    {{- include "pig-trace-analyzer.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.gateway.className }}
  ingressClassName: {{ .Values.gateway.className | quote }}
  {{- end }}
  {{- with .Values.gateway.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.gateway.hosts }}
    - host: {{ required "gateway.hosts[].host is required when gateway.enabled=true" .host | quote }}
      http:
        paths:
          {{- range default $.Values.gateway.paths .paths }}
          - path: {{ required "gateway.hosts[].paths[].path is required when gateway.enabled=true" .path | quote }}
            pathType: {{ default "Exact" .pathType | quote }}
            backend:
              service:
                name: {{ include "pig-trace-analyzer.fullname" $ }}
                port:
                  name: {{ default "http" .servicePortName | quote }}
          {{- end }}
    {{- end }}
{{- end }}
