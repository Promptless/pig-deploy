watchNamespace: pig
image:
  repository: ghcr.io/promptless/pig-supervisor
  # Publication inserts the verified immutable digest. Source renders require an explicit digest.
  digest: ""
releaseCatalogURL: https://raw.githubusercontent.com/Promptless/pig-deploy/main/catalog/stable.json
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
# Required collector ingress, owned by Helm rather than the supervisor.
ingress:
  # Must equal <PIGDeployment name>-analyzer; also preserves the existing Ingress name.
  serviceName: ""
  hostname: ""
  ingressClassName: ""
  # Leave empty when the ingress controller manages the certificate (for example, AWS ALB).
  tlsSecretName: ""
  annotations: {}
