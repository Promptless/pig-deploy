name: Build supervisor candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: pig-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    environment: pig-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the source candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker build -f supervisor/Dockerfile --label "org.opencontainers.image.revision=$SOURCE_COMMIT" --label org.opencontainers.image.source=https://github.com/Promptless/pig-deploy -t "ghcr.io/promptless/pig-supervisor:candidate-$SOURCE_COMMIT" .
          docker run --rm "ghcr.io/promptless/pig-supervisor:candidate-$SOURCE_COMMIT" --version
      - name: Publish candidate for separately authorized acceptance environments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/promptless/pig-supervisor:candidate-$SOURCE_COMMIT"
          docker inspect --format '{{json .RepoDigests}}' "ghcr.io/promptless/pig-supervisor:candidate-$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
