{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pig-trace-analyzer.fullname" . | trunc 55 | trimSuffix "-" }}-migrate
  labels:
    {{- include "pig-trace-analyzer.labels" . | nindent 4 }}
    {{- include "pig-trace-analyzer.datadogLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: maintenance
        app.kubernetes.io/name: {{ include "pig-trace-analyzer.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "pig-trace-analyzer.datadogLabels" . | nindent 8 }}
      {{- if .Values.observability.datadog.enabled }}
      annotations:
        ad.datadoghq.com/migrate.logs: {{ printf "[{\"source\":\"python\",\"service\":%q}]" .Values.observability.datadog.service | quote }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "pig-trace-analyzer.serviceAccountName" . | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "pig-trace-analyzer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: INSTRUCTION_HUB_RUNTIME_BASE_URL
              value: {{ required "instructionHub.runtimeBaseUrl is required" .Values.instructionHub.runtimeBaseUrl | quote }}
            - name: INSTRUCTION_HUB_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: INSTRUCTION_HUB_CONFIG_HASH
              value: {{ required "instructionHub.configHash is required" .Values.instructionHub.configHash | quote }}
            {{- include "pig-trace-analyzer.storageEnv" . | nindent 12 }}
            - name: INSTRUCTION_HUB_LOG_LEVEL
              value: {{ .Values.instructionHub.logLevel | default "INFO" | quote }}
            {{- include "pig-trace-analyzer.observabilityEnv" . | nindent 12 }}
            - name: INSTRUCTION_HUB_INSTALL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pig-trace-analyzer.secretName" . }}
                  key: {{ .Values.secrets.installTokenKey }}
            - name: INSTRUCTION_HUB_CUSTOMER_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pig-trace-analyzer.secretName" . }}
                  key: {{ .Values.secrets.customerPostgresDsnKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "pig-trace-analyzer.caMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "pig-trace-analyzer.caVolume" . | nindent 8 }}
{{- end }}
