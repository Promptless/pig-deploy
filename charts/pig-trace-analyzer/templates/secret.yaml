{{- if and .Values.secrets.create (not .Values.secrets.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "instruction-hub-worker.fullname" . }}
  labels:
    {{- include "instruction-hub-worker.labels" . | nindent 4 }}
  {{- if .Values.migrationJob.enabled }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{ .Values.secrets.installTokenKey }}: {{ required "secrets.installToken is required when secrets.create=true" .Values.secrets.installToken | quote }}
  {{ .Values.secrets.customerPostgresDsnKey }}: {{ required "secrets.customerPostgresDsn is required when secrets.create=true" .Values.secrets.customerPostgresDsn | quote }}
  {{- if and (or .Values.instructionHub.analysis.activationAt .Values.instructionHub.analysis.repository.url) (eq .Values.instructionHub.analysis.modelApi.authentication "api_key") }}
  {{ .Values.secrets.analysisModelApiKeyKey }}: {{ required "secrets.analysisModelApiKey is required when the Hub model uses api_key authentication" .Values.secrets.analysisModelApiKey | quote }}
  {{- end }}
  {{- if and (or .Values.instructionHub.analysis.activationAt .Values.instructionHub.analysis.repository.url) .Values.instructionHub.analysis.repository.tokenSecretEnabled }}
  {{ .Values.secrets.analysisRepositoryTokenKey }}: {{ required "secrets.analysisRepositoryToken is required when repository token support is enabled" .Values.secrets.analysisRepositoryToken | quote }}
  {{- end }}
{{- end }}
